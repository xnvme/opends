# SPDX-License-Identifier: BSD-3-Clause
name: run on nvme-cuda

on:
  workflow_call:
    inputs:
      name:
        description: The calling job's name; names its artifacts
        required: true
        type: string
      run:
        description: The command that runs the suite or the benchmark
        required: true
        type: string
      teardown:
        description: The cijoe task and steps that bring the stack down
        required: true
        type: string
      report:
        description: Render the bench report before uploading
        type: boolean
        default: false
      timeout-minutes:
        description: Run budget plus a day of waiting for the machine
        required: true
        type: number

jobs:
  nvme-cuda:
    runs-on: nvme-cuda
    # xnvme-devenv's host container has QEMU and cijoe; the suite runs in a guest it boots.
    # Privileged for /dev/kvm and vfio; passed-through devices need the guest's memory locked.
    container:
      image: ghcr.io/xnvme/xnvme-devenv/host:v0.15.0
      options: --privileged --ulimit memlock=-1
      volumes:
        - /etc/opends-ci:/etc/opends-ci:ro
        - /var/cache/opends-ci:/github/home/system_imaging
    defaults:
      run:
        shell: bash
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      OPENDS_CI_JOB: ${{ inputs.name }}
      OPENDS_CI_PR: ${{ github.event.pull_request.number }}
      OPENDS_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENDS_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the guest as the target
        run: |
          cp ci/configs/guest-transport.toml ci/configs/transport.toml
          cp ci/configs/guest-test.toml ci/configs/test.toml
          echo /root/.local/bin >> "$GITHUB_PATH"
      - name: Boot the guest
        id: guest
        run: ci/scripts/guest.py up
      - run: ci/scripts/rsync.py
      - run: ci/scripts/setup_deps.py
      - run: ci/scripts/build.py
      # A backend that is not built turns its tests into stubs that pass
      - name: Check that the cuFile and aisio backends were built
        run: ssh localhost ls /root/build/opends-build/libopends_cufile.so /root/build/opends-build/libopends_aisio.so
      - run: ${{ inputs.run }}
      - name: Render the report
        if: inputs.report
        run: ci/scripts/bench/report.py
      - name: Bundle the results
        if: inputs.report
        run: ci/scripts/bench/results.py
      - name: Upload the results
        if: inputs.report
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.name }}
          path: ci/results
          overwrite: true
      - name: Tear the stack down
        if: always() && steps.guest.outcome == 'success'
        working-directory: ci
        run: cijoe -m -s -o cijoe-output-teardown -c configs/transport.toml -c configs/deps.toml -c configs/test.toml ${{ inputs.teardown }}
      - name: Stop the guest
        if: always()
        run: ci/scripts/guest.py down
      - name: Upload the cijoe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: ci/cijoe-output-*
          overwrite: true
      # The container runs as root, and the runner's user cleans up after it
      - name: Give the files back to the runner's user
        if: always()
        run: chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE" "$HOME"
