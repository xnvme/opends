# SPDX-License-Identifier: BSD-3-Clause
doc: |
  OpenDS Bench Suite
  ==================

  Drives filperf with the `opends` backend (OpenDS aisio reading files
  on a mounted filesystem into GPU memory) across the four reference
  datasets (filesize8gib, tiktokish, imagenetish, lmcacheish).

  homi_stack_up hands the controller to homi, exposes it as a ublk
  block device (qublk), remounts the dataset XFS over it, and starts
  xal-server on the mount. fil walks xal on the ublk block device to
  enumerate the dataset (mirroring the cufile path) and opens each file by
  path; the aisio backend resolves extents from the xal-server index
  and drives its own I/O queues on the controller homi holds up, DMAing
  straight to GPU memory. homi_stack_down tears the stack down and
  rebinds nvme.

  Prerequisites and artifacts: as in bench_cufile.yaml.

steps:
  - name: check_stack_down
    run: |
      '{{ config.test.repo_path }}/ci/tasks/steps/check_stack_down.sh' '{{ config.test.nvme_bdf }}'

  - name: cpu_governor
    run: |
      '{{ config.test.repo_path }}/ci/tasks/steps/cpu_governor.sh'

  - name: meta
    uses: bench_meta

  - name: homi_stack_up
    run: |
      . '{{ config.test.repo_path }}/ci/tasks/steps/install_prefix.sh' '{{ config.deps.install_prefix | default("/usr/local") }}' && \
        '{{ config.test.repo_path }}/ci/tasks/steps/homi_stack_up.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.mount_point }}'

  - name: opends_filesize8gib
    uses: bench_run
    with:
      backend: opends
      data-dir: filesize8gib
      batches: 1
      batch-size: 1

  - name: opends_filesize8gib_stream
    uses: bench_run
    with:
      backend: opends
      data-dir: filesize8gib
      batches: 1
      batch-size: 1
      mode: stream

  - name: opends_filesize8gib_async
    uses: bench_run
    with:
      backend: opends
      data-dir: filesize8gib
      batches: 1
      batch-size: 1
      mode: async

  - name: opends_tiktokish
    uses: bench_run
    with:
      backend: opends
      data-dir: tiktokish
      batches: 200
      batch-size: 26

  - name: opends_tiktokish_stream
    uses: bench_run
    with:
      backend: opends
      data-dir: tiktokish
      batches: 200
      batch-size: 26
      mode: stream

  - name: opends_tiktokish_async
    uses: bench_run
    with:
      backend: opends
      data-dir: tiktokish
      batches: 200
      batch-size: 26
      mode: async

  - name: opends_lmcacheish
    uses: bench_run
    with:
      backend: opends
      data-dir: lmcacheish
      batches: 70
      batch-size: 26

  - name: opends_lmcacheish_stream
    uses: bench_run
    with:
      backend: opends
      data-dir: lmcacheish
      batches: 70
      batch-size: 26
      mode: stream

  - name: opends_lmcacheish_async
    uses: bench_run
    with:
      backend: opends
      data-dir: lmcacheish
      batches: 70
      batch-size: 26
      mode: async

  - name: opends_imagenetish
    uses: bench_run
    with:
      backend: opends
      data-dir: imagenetish
      batches: 300
      batch-size: 4096

  - name: opends_imagenetish_stream
    uses: bench_run
    with:
      backend: opends
      data-dir: imagenetish
      batches: 300
      batch-size: 4096
      mode: stream

  - name: opends_imagenetish_async
    uses: bench_run
    with:
      backend: opends
      data-dir: imagenetish
      batches: 300
      batch-size: 4096
      mode: async

  - name: homi_stack_down
    run: |
      '{{ config.test.repo_path }}/ci/tasks/steps/homi_stack_down.sh' '{{ config.test.nvme_bdf }}'

  - name: cpu_governor_restore
    run: |
      '{{ config.test.repo_path }}/ci/tasks/steps/cpu_governor.sh' restore
