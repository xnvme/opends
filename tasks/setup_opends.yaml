doc: |
  Setup OpenDS
  =============

  Builds all available backends with meson on the target. Assumes
  scripts/rsync.py has synced the working tree to config.test.repo_path.

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/deps.toml \
        -c configs/test.toml \
        tasks/setup_opends.yaml

steps:
  - name: build
    run: |
      '{{ config.test.repo_path }}/tasks/steps/build_opends.sh' '{{ config.test.repo_path }}' '{{ config.test.build_dir }}' '{{ config.deps.install_prefix | default("/usr/local") }}'
