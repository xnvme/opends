doc: |
  Setup fil
  =========

  Clones or updates the fil repository on the target, checks out the
  configured ref (branch, tag, or commit), then builds and installs
  fil so the filperf binary is available for benchmarking. The remote
  and ref are read from [fil.repository] in deps.toml.

  fil depends on xnvme, xal, and CUDA cuFile; run setup_xnvme and
  setup_xal first (setup_deps.py orders them correctly).

  Benchmarks driven by filperf require a populated XFS dataset on the
  target NVMe; run aisio's tasks/setup_dataset.yaml on the target
  before invoking the bench tasks.

  Assumes the OpenDS tree has been synced to the target (setup_deps.py
  does this).

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/deps.toml \
        -c configs/test.toml \
        tasks/setup_fil.yaml

steps:
  - name: setup_fil
    run: |
      '{{ config.test.repo_path }}/tasks/steps/setup_meson_dep.sh' {{ '--reset' if config.deps.reset else '' }} '{{ config.fil.repository.remote }}' '{{ config.fil.repository.ref }}' '{{ config.deps.src_root }}/fil' '{{ config.deps.build_root }}/fil-build' '{{ config.deps.install_prefix | default("/usr/local") }}'
