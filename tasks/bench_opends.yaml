# SPDX-License-Identifier: BSD-3-Clause
doc: |
  OpenDS Bench Suite
  ==================

  Drives filperf with the `opends` backend (OpenDS aisio reading files
  on a mounted filesystem into GPU memory) across the four reference
  datasets (filesize8gib, tiktokish, imagenetish, lmcacheish).

  homi_stack_up hands the controller to HOMI, exposes it as a ublk
  block device (qublk), and remounts the dataset XFS over it. fil walks
  xal on the ublk block device to enumerate the dataset (mirroring the
  gds path) and opens each file by path; the aisio backend resolves
  extents and attaches an I/O qpair from HOMI per file, DMAing straight
  to GPU memory. homi_stack_down tears the stack down and rebinds nvme.

  Prerequisites:
    * scripts/setup_deps.py has installed xnvme, xal, OpenDS, fil, homi,
      and qublk on the target.
    * scripts/build.py has built OpenDS on the target.
    * aisio's tasks/setup_dataset.yaml has run on the target, formatting
      the NVMe with XFS and populating the first three reference datasets
      (filesize8gib, tiktokish, imagenetish) under config.test.mount_point.
    * OpenDS's tasks/setup_dataset.yaml (scripts/bench/setup_dataset.py) has
      populated lmcacheish.

  bench_meta records the build commit + target platform to
  artifacts/meta.json; each bench_run stashes filperf's verbatim
  stdout to artifacts/<backend>_<data_dir>.log for downstream
  parsing by scripts/bench_report.py.

steps:
  - name: cpu_governor
    run: |
      '{{ config.test.repo_path }}/tasks/steps/cpu_governor.sh'

  - name: meta
    uses: bench_meta

  - name: homi_stack_up
    run: |
      '{{ config.test.repo_path }}/tasks/steps/homi_stack_up.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.mount_point }}'

  - name: opends_filesize8gib
    uses: bench_run
    with:
      backend: opends
      data-dir: filesize8gib
      batches: 1
      batch-size: 1

  - name: opends_filesize8gib_async
    uses: bench_run
    with:
      backend: opends
      data-dir: filesize8gib
      batches: 1
      batch-size: 1
      mode: async

  - name: opends_tiktokish
    uses: bench_run
    with:
      backend: opends
      data-dir: tiktokish
      batches: 1
      batch-size: 26

  - name: opends_tiktokish_async
    uses: bench_run
    with:
      backend: opends
      data-dir: tiktokish
      batches: 1
      batch-size: 26
      mode: async

  - name: opends_imagenetish
    uses: bench_run
    with:
      backend: opends
      data-dir: imagenetish
      batches: 300
      batch-size: 4096

  - name: opends_imagenetish_async
    uses: bench_run
    with:
      backend: opends
      data-dir: imagenetish
      batches: 300
      batch-size: 4096
      mode: async

  - name: opends_lmcacheish
    uses: bench_run
    with:
      backend: opends
      data-dir: lmcacheish
      batches: 70
      batch-size: 26

  - name: opends_lmcacheish_async
    uses: bench_run
    with:
      backend: opends
      data-dir: lmcacheish
      batches: 70
      batch-size: 26
      mode: async

  - name: homi_stack_down
    run: |
      '{{ config.test.repo_path }}/tasks/steps/homi_stack_down.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.mount_point }}'
