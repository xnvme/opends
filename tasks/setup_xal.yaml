doc: |
  Setup xal
  =========

  Clones or updates the xal repository on the target, checks out the
  configured ref (branch, tag, or commit), then builds and installs xal
  so its pkg-config file becomes discoverable by fil. The remote and
  ref are read from [xal.repository] in deps.toml.

  xal (eXtent Access Library) is a transitive dependency of fil; fil's
  iter walks the on-device XFS metadata via xal to enumerate the
  dataset. OpenDS links it too, to attach to the extent index that
  xal-server publishes over shared memory.

  The pin is upstream main with xal-server (xnvme/xal#47) merged. It
  adds the xal-server tool, which indexes a mounted filesystem and
  publishes the index over POSIX shared memory, and the xal_from_shm
  attach path the aisio backend reads it through.

  Assumes the OpenDS tree has been synced to the target (setup_deps.py
  does this).

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/deps.toml \
        -c configs/test.toml \
        tasks/setup_xal.yaml

steps:
  - name: setup_xal
    run: |
      '{{ config.test.repo_path }}/tasks/steps/setup_meson_dep.sh' '{{ config.xal.repository.remote }}' '{{ config.xal.repository.ref }}' '{{ config.deps.src_root }}/xal' '{{ config.deps.build_root }}/xal-build' -Dxal-server=enabled
