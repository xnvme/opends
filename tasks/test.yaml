doc: |
  OpenDS Test Suite
  ==================

  Runs all available backend tests. Reference backend tests always run.
  GDS tests run only when the GDS backend was built. aisio tests run
  when both xNVMe and CUDA were found.

  The ref/GDS phases run against the kernel-mounted filesystem. The
  aisio phase then brings up the HOMI/qublk stack (homi_stack_up): it
  hands the controller to userspace, exposes it as a ublk block device,
  and remounts the same XFS over it, so the sync-read pattern written
  during prep is still present. The aisio tests attach I/O qpairs from
  HOMI and read that pattern file. homi_stack_down tears the stack down
  and rebinds nvme so iterative runs leave the target usable.

  Prerequisites:
    - setup_opends.yaml has been run (sync_and_build.py does this).
    - The XFS filesystem on the test namespace already exists. The
      mount step will not format the device; provision it externally
      (e.g. via aisio's setup_dataset.yaml). The test writes only into
      ``<mount>/opends_tests/`` so any sibling dataset directory is
      left untouched.

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/deps.toml \
        -c configs/test.toml \
        tasks/test.yaml

steps:
  - name: bind_nvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/bind_nvme.sh' '{{ config.test.nvme_bdf }}'

  - name: mount
    run: |
      '{{ config.test.repo_path }}/tasks/steps/mount_nvme.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.mount_point }}'

  - name: prepare_test_dir
    run: |
      mkdir -p '{{ config.test.mount_point }}/opends_tests'

  - name: test_smoke_ref
    run: |
      '{{ config.test.build_dir }}/test_smoke_ref'

  - name: test_sync_read_prep
    run: |
      '{{ config.test.build_dir }}/test_sync_read_prep' \
        '{{ config.test.mount_point }}/opends_tests/sync_read_pattern.bin'

  - name: test_coherency_prep
    run: |
      dd if=/dev/urandom \
        of='{{ config.test.mount_point }}/opends_tests/coherency_large.bin' \
        bs=1M count=64 status=none conv=fsync

  - name: test_sync_read_ref
    run: |
      '{{ config.test.build_dir }}/test_sync_read_ref' '{{ config.test.mount_point }}/opends_tests/sync_read_pattern.bin'

  - name: test_mt_read_ref
    run: |
      '{{ config.test.build_dir }}/test_mt_read_ref' '{{ config.test.mount_point }}/opends_tests/sync_read_pattern.bin'

  - name: test_sync_read_gds
    run: |
      '{{ config.test.build_dir }}/test_sync_read_gds' '{{ config.test.mount_point }}/opends_tests/sync_read_pattern.bin'

  - name: homi_stack_up
    run: |
      '{{ config.test.repo_path }}/tasks/steps/homi_stack_up.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.mount_point }}'

  - name: test_sync_read_aisio
    run: |
      OPENDS_HOMI_DEV='{{ config.test.nvme_bdf }}' OPENDS_HOMI_SOCKET=/run/homi/homi.sock \
        OPENDS_HOMI_MNT='{{ config.test.mount_point }}' \
        '{{ config.test.build_dir }}/test_sync_read_aisio' \
          '{{ config.test.mount_point }}/opends_tests/sync_read_pattern.bin'

  - name: test_mt_read_aisio
    run: |
      OPENDS_HOMI_DEV='{{ config.test.nvme_bdf }}' OPENDS_HOMI_SOCKET=/run/homi/homi.sock \
        OPENDS_HOMI_MNT='{{ config.test.mount_point }}' \
        '{{ config.test.build_dir }}/test_mt_read_aisio' \
          '{{ config.test.mount_point }}/opends_tests/sync_read_pattern.bin'

  - name: test_register_large_aisio
    run: |
      # Increase fd limit to support more than enough file descriptors needed for xnvme cuda memory mapping.
      echo "fd limit (soft/hard): $(ulimit -Sn)/$(ulimit -Hn)"
      OPENDS_HOMI_DEV='{{ config.test.nvme_bdf }}' OPENDS_HOMI_SOCKET=/run/homi/homi.sock \
        OPENDS_HOMI_MNT='{{ config.test.mount_point }}' \
        prlimit --nofile=1048576:1048576 -- \
          '{{ config.test.build_dir }}/test_register_large_aisio' \
            '{{ config.test.mount_point }}/opends_tests/sync_read_pattern.bin'

  - name: test_coherency_aisio
    run: |
      OPENDS_HOMI_DEV='{{ config.test.nvme_bdf }}' OPENDS_HOMI_SOCKET=/run/homi/homi.sock \
        OPENDS_HOMI_MNT='{{ config.test.mount_point }}' \
        '{{ config.test.build_dir }}/test_coherency_aisio' \
          '{{ config.test.mount_point }}/opends_tests/coherency_large.bin'

  - name: test_async_read_aisio
    run: |
      OPENDS_HOMI_DEV='{{ config.test.nvme_bdf }}' OPENDS_HOMI_SOCKET=/run/homi/homi.sock \
        OPENDS_HOMI_MNT='{{ config.test.mount_point }}' \
        '{{ config.test.build_dir }}/test_async_read_aisio' \
          '{{ config.test.mount_point }}/opends_tests/sync_read_pattern.bin'

  - name: test_sync_write_aisio
    run: |
      OPENDS_HOMI_DEV='{{ config.test.nvme_bdf }}' OPENDS_HOMI_SOCKET=/run/homi/homi.sock \
        OPENDS_HOMI_MNT='{{ config.test.mount_point }}' \
        '{{ config.test.build_dir }}/test_sync_write_aisio' \
          '{{ config.test.mount_point }}/opends_tests/write_scratch.bin'

  - name: test_async_write_aisio
    run: |
      OPENDS_HOMI_DEV='{{ config.test.nvme_bdf }}' OPENDS_HOMI_SOCKET=/run/homi/homi.sock \
        OPENDS_HOMI_MNT='{{ config.test.mount_point }}' \
        '{{ config.test.build_dir }}/test_async_write_aisio' \
          '{{ config.test.mount_point }}/opends_tests/write_scratch.bin'

  - name: test_block_alloc_aisio
    run: |
      OPENDS_HOMI_DEV='{{ config.test.nvme_bdf }}' OPENDS_HOMI_SOCKET=/run/homi/homi.sock \
        OPENDS_HOMI_MNT='{{ config.test.mount_point }}' \
        '{{ config.test.build_dir }}/test_block_alloc_aisio' \
          '{{ config.test.mount_point }}/opends_tests/write_scratch.bin'

  - name: homi_stack_down
    run: |
      '{{ config.test.repo_path }}/tasks/steps/homi_stack_down.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.mount_point }}'
