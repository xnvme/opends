# SPDX-License-Identifier: BSD-3-Clause
doc: |
  GDS Bench Suite
  ===============

  Drives filperf with the `gds` backend (cuFile reference baseline)
  across the four reference datasets (filesize8gib, tiktokish,
  imagenetish, lmcacheish). Runs while the kernel `nvme` driver owns
  the device.

  Prerequisites:
    * scripts/setup_deps.py has installed xnvme, xal, OpenDS, and fil
      on the target.
    * scripts/build.py has built OpenDS on the target.
    * aisio's tasks/setup_dataset.yaml has run on the target, formatting
      the NVMe with XFS and populating the first three reference datasets
      (filesize8gib, tiktokish, imagenetish) under config.test.mount_point.
    * OpenDS's tasks/setup_dataset.yaml (scripts/bench/setup_dataset.py) has
      populated lmcacheish.

  bench_meta records the build commit + target platform to
  artifacts/meta.json; each bench_run stashes filperf's verbatim
  stdout to artifacts/<backend>_<data_dir>.log for downstream
  parsing by scripts/bench_report.py.

steps:
  - name: cpu_governor
    run: |
      '{{ config.test.repo_path }}/tasks/steps/cpu_governor.sh'

  - name: load_nvidia_fs
    run: |
      '{{ config.test.repo_path }}/tasks/steps/load_nvidia_fs.sh'

  - name: meta
    uses: bench_meta

  - name: bind_nvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/bind_nvme.sh' '{{ config.test.nvme_bdf }}'

  - name: mount
    run: |
      '{{ config.test.repo_path }}/tasks/steps/mount_nvme.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.mount_point }}'

  - name: gds_filesize8gib
    uses: bench_run
    with:
      backend: gds
      data-dir: filesize8gib
      batches: 1
      batch-size: 1
      mnt: "{{ config.test.mount_point }}"

  - name: gds_filesize8gib_async
    uses: bench_run
    with:
      backend: gds
      data-dir: filesize8gib
      batches: 1
      batch-size: 1
      mode: async
      mnt: "{{ config.test.mount_point }}"

  - name: gds_tiktokish
    uses: bench_run
    with:
      backend: gds
      data-dir: tiktokish
      batches: 1
      batch-size: 26
      mnt: "{{ config.test.mount_point }}"

  - name: gds_tiktokish_async
    uses: bench_run
    with:
      backend: gds
      data-dir: tiktokish
      batches: 1
      batch-size: 26
      mode: async
      mnt: "{{ config.test.mount_point }}"

  - name: gds_imagenetish
    uses: bench_run
    with:
      backend: gds
      data-dir: imagenetish
      batches: 300
      batch-size: 4096
      mnt: "{{ config.test.mount_point }}"

  - name: gds_imagenetish_async
    uses: bench_run
    with:
      backend: gds
      data-dir: imagenetish
      batches: 300
      batch-size: 4096
      mode: async
      mnt: "{{ config.test.mount_point }}"

  - name: gds_lmcacheish
    uses: bench_run
    with:
      backend: gds
      data-dir: lmcacheish
      batches: 70
      batch-size: 26
      mnt: "{{ config.test.mount_point }}"

  - name: gds_lmcacheish_async
    uses: bench_run
    with:
      backend: gds
      data-dir: lmcacheish
      batches: 70
      batch-size: 26
      mode: async
      mnt: "{{ config.test.mount_point }}"
