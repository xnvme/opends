doc: |
  Setup xNVMe
  ============

  Clones or updates the xNVMe repository on the target, checks out the
  configured ref (branch, tag, or commit), then builds and installs
  xNVMe so its pkg-config file becomes discoverable when building
  OpenDS. The remote and ref are read from [xnvme.repository] in
  deps.toml, which pins the build dependency for the whole project.

  The pin is the head of xnvme/xnvme#770, the tip of the homi series
  (#795, #769, #803, #764, #770): controllers served over a socket, GPU
  clients, and I/O the GPU issues itself. It is a frozen sha because the
  series is rebased under review. Move the pin to upstream main once the
  series lands.

  The homi and qublk tools install with the library; the test and
  bench tasks start them from PATH. Building qublk needs liburing
  (>= 2.3) and the ublk kernel headers (kernel >= 6.0); running it
  needs the ublk_drv module loaded.

  Assumes the OpenDS tree has been synced to the target (setup_deps.py
  does this).

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/deps.toml \
        -c configs/test.toml \
        tasks/setup_xnvme.yaml

steps:
  - name: setup_xnvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/setup_meson_dep.sh' '{{ config.xnvme.repository.remote }}' '{{ config.xnvme.repository.ref }}' '{{ config.deps.src_root }}/xnvme' '{{ config.deps.build_root }}/xnvme-build'
