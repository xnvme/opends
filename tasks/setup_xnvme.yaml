doc: |
  Setup xNVMe
  ============

  Clones the xNVMe repository on the target afresh, checks out the
  configured ref (branch, tag, or commit), then builds and installs
  xNVMe so its pkg-config file becomes discoverable when building
  OpenDS. The remote and ref are read from [xnvme.repository] in
  deps.toml, which pins the build dependency for the whole project.

  The homi and qublk tools install with the library into the same
  prefix, where the test and bench tasks start them from. Building
  qublk needs liburing and the ublk kernel headers, and running it
  needs the ublk_drv module loaded.

  Assumes the OpenDS tree has been synced to the target (setup_deps.py
  does this).

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/deps.toml \
        -c configs/test.toml \
        tasks/setup_xnvme.yaml

steps:
  - name: setup_xnvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/setup_meson_dep.sh' '{{ config.xnvme.repository.remote }}' '{{ config.xnvme.repository.ref }}' '{{ config.deps.src_root }}/xnvme' '{{ config.deps.build_root }}/xnvme-build' '{{ config.deps.install_prefix | default("/usr/local") }}'
