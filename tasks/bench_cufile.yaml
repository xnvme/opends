# SPDX-License-Identifier: BSD-3-Clause
doc: |
  cuFile Bench Suite
  ==================

  Drives filperf with the `cufile` backend (GDS reference baseline)
  across the four reference datasets (filesize8gib, tiktokish,
  imagenetish, lmcacheish). Runs while the kernel `nvme` driver owns
  the device.

  Prerequisites:
    * scripts/setup_deps.py has installed xnvme, xal, OpenDS, and fil
      on the target.
    * scripts/build.py has built OpenDS on the target.
    * aisio's tasks/setup_dataset.yaml has run on the target, formatting
      the NVMe with XFS and populating the first three reference datasets
      (filesize8gib, tiktokish, imagenetish) under config.test.mount_point.
    * OpenDS's tasks/setup_dataset.yaml (scripts/bench/setup_dataset.py) has
      populated lmcacheish.

  bench_meta records the build commit + target platform to
  artifacts/meta.json; each bench_run stashes filperf's verbatim
  stdout to artifacts/<backend>_<data_dir>_<mode>.log for downstream
  parsing by scripts/bench/report.py.

steps:
  - name: cpu_governor
    run: |
      '{{ config.test.repo_path }}/tasks/steps/cpu_governor.sh'

  - name: load_nvidia_fs
    run: |
      '{{ config.test.repo_path }}/tasks/steps/load_nvidia_fs.sh'

  - name: meta
    uses: bench_meta

  - name: bind_nvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/bind_nvme.sh' '{{ config.test.nvme_bdf }}'

  - name: mount
    run: |
      '{{ config.test.repo_path }}/tasks/steps/mount_nvme.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.mount_point }}'

  - name: cufile_filesize8gib
    uses: bench_run
    with:
      backend: cufile
      data-dir: filesize8gib
      batches: 1
      batch-size: 1
      mnt: "{{ config.test.mount_point }}"

  - name: cufile_filesize8gib_stream
    uses: bench_run
    with:
      backend: cufile
      data-dir: filesize8gib
      batches: 1
      batch-size: 1
      mode: stream
      mnt: "{{ config.test.mount_point }}"

  - name: cufile_tiktokish
    uses: bench_run
    with:
      backend: cufile
      data-dir: tiktokish
      batches: 200
      batch-size: 26
      mnt: "{{ config.test.mount_point }}"

  - name: cufile_tiktokish_stream
    uses: bench_run
    with:
      backend: cufile
      data-dir: tiktokish
      batches: 200
      batch-size: 26
      mode: stream
      mnt: "{{ config.test.mount_point }}"

  - name: cufile_imagenetish
    uses: bench_run
    with:
      backend: cufile
      data-dir: imagenetish
      batches: 300
      batch-size: 4096
      mnt: "{{ config.test.mount_point }}"

  - name: cufile_imagenetish_stream
    uses: bench_run
    with:
      backend: cufile
      data-dir: imagenetish
      batches: 300
      batch-size: 4096
      mode: stream
      mnt: "{{ config.test.mount_point }}"

  - name: cufile_lmcacheish
    uses: bench_run
    with:
      backend: cufile
      data-dir: lmcacheish
      batches: 70
      batch-size: 26
      mnt: "{{ config.test.mount_point }}"

  - name: cufile_lmcacheish_stream
    uses: bench_run
    with:
      backend: cufile
      data-dir: lmcacheish
      batches: 70
      batch-size: 26
      mode: stream
      mnt: "{{ config.test.mount_point }}"

  - name: cpu_governor_restore
    run: |
      '{{ config.test.repo_path }}/tasks/steps/cpu_governor.sh' restore
