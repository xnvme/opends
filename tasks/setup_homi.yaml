doc: |
  Setup HOMI
  ==========

  Clones or updates the HOMI repository on the target, checks out the
  configured ref (branch, tag, or commit), then builds and installs the
  homid daemon and libhomic client. The remote and ref are read from
  [homi.repository] in deps.toml.

  HOMI depends on xal and xnvme (both via pkg-config) and on libsystemd;
  run setup_xnvme and setup_xal first (setup_deps.py orders them
  correctly). The meson install step also drops a systemd unit and a
  default /etc/homi/homi.conf on the target.

  Assumes the OpenDS tree has been synced to the target (setup_deps.py
  does this).

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/deps.toml \
        -c configs/test.toml \
        tasks/setup_homi.yaml

steps:
  - name: setup_homi
    run: |
      '{{ config.test.repo_path }}/tasks/steps/setup_meson_dep.sh' '{{ config.homi.repository.remote }}' '{{ config.homi.repository.ref }}' '{{ config.deps.src_root }}/homi' '{{ config.deps.build_root }}/homi-build' '{{ config.deps.install_prefix | default("/usr/local") }}'
