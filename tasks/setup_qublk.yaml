doc: |
  Setup qublk
  ===========

  Clones the qublk repository on the target afresh, checks out the
  configured ref (branch, tag, or commit), then builds and installs the
  qublk ublk server. The remote and ref are read from [qublk.repository]
  in deps.toml.

  qublk depends on installed xnvme plus liburing (>= 2.3) and the ublk
  kernel headers (linux/ublk_cmd.h, kernel >= 6.0); run setup_xnvme
  first (setup_deps.py orders them correctly). Running the resulting
  binary additionally needs the ublk_drv module loaded
  (modprobe ublk_drv).

  Assumes the OpenDS tree has been synced to the target (setup_deps.py
  does this).

  Run::

      cijoe \
        -c configs/transport.toml \
        -c configs/deps.toml \
        -c configs/test.toml \
        tasks/setup_qublk.yaml

steps:
  - name: setup_qublk
    run: |
      '{{ config.test.repo_path }}/tasks/steps/setup_meson_dep.sh' '{{ config.qublk.repository.remote }}' '{{ config.qublk.repository.ref }}' '{{ config.deps.src_root }}/qublk' '{{ config.deps.build_root }}/qublk-build' '{{ config.deps.install_prefix | default("/usr/local") }}'
