doc: |
  KV cache with LMCache
  =====================

  Runs LMCache's own `lmcache bench server` against an LMCache server whose
  L1 tier is a GDS slab on the test drive, once on cuFile and once on OpenDS.
  cufile runs while the kernel nvme driver owns the drive, opends runs on the
  HOMI stack, where the index name is the one homi_stack_up.sh starts
  xal-server with. See README.md beside this file.

  Prerequisites: scripts/setup_deps.py and scripts/build.py have run, and the
  XFS filesystem on the test namespace exists. run.py beside this file passes
  the configs and brings the stack down afterwards.

steps:
  - name: check_stack_down
    run: |
      '{{ config.test.repo_path }}/tasks/steps/check_stack_down.sh' '{{ config.test.nvme_bdf }}'

  - name: cpu_governor
    run: |
      '{{ config.test.repo_path }}/tasks/steps/cpu_governor.sh'

  - name: load_nvidia_fs
    run: |
      '{{ config.test.repo_path }}/tasks/steps/load_nvidia_fs.sh'

  - name: meta
    uses: bench_meta

  - name: install
    run: |
      '{{ config.test.repo_path }}/benchmarks/kv-cache-lmcache/steps/install.sh' '{{ config.lmcache.repository.remote }}' '{{ config.lmcache.repository.ref }}' '{{ config.lmcache.torch.version }}' '{{ config.lmcache.torch.index }}' '{{ config.test.model_cache | default("/var/cache/opends-bench") }}/lmcache'

  - name: bind_nvme
    run: |
      '{{ config.test.repo_path }}/tasks/steps/bind_nvme.sh' '{{ config.test.nvme_bdf }}'

  - name: mount
    run: |
      '{{ config.test.repo_path }}/tasks/steps/mount_nvme.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.mount_point }}'

  - name: bench_cufile
    run: |
      mkdir -p '{{ config.test.mount_point }}/opends_tests'
      '{{ config.test.repo_path }}/benchmarks/kv-cache-lmcache/steps/bench_server.sh' '{{ config.test.model_cache | default("/var/cache/opends-bench") }}/lmcache/venv' cufile '{{ config.test.mount_point }}/opends_tests' 16 128

  # xal-server indexes the extents at stack up, so the slab of the opends leg
  # is made here. LMCache makes the slab of the cufile leg the same way.
  - name: slab
    run: |
      rm -f '{{ config.test.mount_point }}/opends_tests/lmcache_gds_slab.bin'
      fallocate -l 16G '{{ config.test.mount_point }}/opends_tests/lmcache_gds_slab.bin'

  - name: homi_stack_up
    run: |
      . '{{ config.test.repo_path }}/tasks/steps/install_prefix.sh' '{{ config.deps.install_prefix | default("/usr/local") }}' && \
        '{{ config.test.repo_path }}/tasks/steps/homi_stack_up.sh' '{{ config.test.nvme_bdf }}' '{{ config.test.mount_point }}'

  - name: bench_opends
    run: |
      . '{{ config.test.repo_path }}/tasks/steps/install_prefix.sh' '{{ config.deps.install_prefix | default("/usr/local") }}' && \
        OPENDS_XAL_SHM=/xal_dev0 OPENDS_HOMI_MNT='{{ config.test.mount_point }}' OPENDS_BACKEND=aisio OPENDS_LIBRARY='{{ config.test.build_dir }}/libopends_aisio.so' PYTHONPATH='{{ config.test.repo_path }}/python' '{{ config.test.repo_path }}/benchmarks/kv-cache-lmcache/steps/bench_server.sh' '{{ config.test.model_cache | default("/var/cache/opends-bench") }}/lmcache/venv' opends '{{ config.test.mount_point }}/opends_tests' 16 128

  - name: remove_slab
    run: |
      rm -f '{{ config.test.mount_point }}/opends_tests/lmcache_gds_slab.bin'

  - name: homi_stack_down
    run: |
      '{{ config.test.repo_path }}/tasks/steps/homi_stack_down.sh' '{{ config.test.nvme_bdf }}'

  - name: cpu_governor_restore
    run: |
      '{{ config.test.repo_path }}/tasks/steps/cpu_governor.sh' restore
